[package]
name = "soma-scratchpad"
version = "0.6.1"
description = "Soma Scratchpad"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
mime_guess = "2"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Task 8/9: 显式声明 tokio features（Tauri 2 间接依赖 tokio，但默认未启用全部 features）。
# `sync` 用于运行时同步原语，`time` 用于 cooldown 计算；`tokio-util` 提供
# `CancellationToken`（Task 9 用于可取消搜索）；`macros` 提供 `tokio::select!`
# 宏（Task 9 用于 cancel-aware LLM 调用）。
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
